name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * 1,4'  # Runs every Monday and Thursday at noon
  workflow_dispatch:          # Lets you run it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://fpogybpfoqvyncbloxzl.supabase.co/rest/v1/scores" \
          -H "apikey: ${{ secrets.SUPABASE_API_KEY }}"
